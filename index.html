<!DOCTYPE html>
<html>
<head>
  <title>My Boosting Site</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      font-size: 1.1rem;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background: linear-gradient(45deg, purple, cyan);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 40px 20px;
    }

    .card {
      background: #1b1b1b;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>Boost Your Social Media</h1>

    <p>Fast • Secure • Affordable</p>

    <a href="#" class="btn">Get Started</a>
  </section>

  <section class="services">

    <div class="card">
      <h2>Instagram</h2>
      <p>Followers • Likes • Views</p>
    </div>

    <div class="card">
      <h2>TikTok</h2>
      <p>Followers • Shares • Likes</p>
    </div>

    <div class="card">
      <h2>YouTube</h2>
      <p>Subscribers • Views • Watchtime</p>
    </div>

  </section>

</body>
  </html>
